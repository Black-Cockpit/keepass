# --------------------------------------------------------------------------------------------------
# File Name       : ansible.cfg
# Description     : Local development configuration for the hasnimehdi91.keepass collection.
#                   Binds the local inventory and loads the modules straight from the checkout,
#                   so they run without installing the collection.
# Scope           : Loaded automatically when ansible-playbook runs from the repository root.
#                   Excluded from the built collection.
# --------------------------------------------------------------------------------------------------

[defaults]
# Local inventory, gitignored and created by each developer
inventory = ./inventory.ini

# Facts are gathered only when a play explicitly asks for them
gathering = explicit

# Development targets are disposable; no persistent known_hosts
host_key_checking = False

# Shell used for command/shell modules on targets
executable = /bin/bash

# Default callback on both output streams
stdout_callback = ansible.builtin.default
stderr_callback = ansible.builtin.default

# Task results rendered as YAML for readable output
result_format = yaml

# Modules are loaded from the checkout, so they are called by their short name
library = ./plugins/modules

[inventory]
# A malformed inventory source aborts the run instead of silently targeting nothing
unparsed_is_failed=True
